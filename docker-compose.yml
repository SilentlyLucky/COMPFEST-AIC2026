services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3012}
      HOST: 0.0.0.0
      PORT: 8012
      WORKERS: ${BACKEND_WORKERS:-1}
    volumes:
      - ./backend:/app
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/app/../.cache/huggingface
    expose:
      - "8012"
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8012
    environment:
      BACKEND_INTERNAL_URL: http://backend:8012
    ports:
      - "${FRONTEND_PORT:-3012}:3012"
    depends_on:
      backend:
        condition: service_healthy
