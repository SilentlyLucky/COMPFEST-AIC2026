<svg xmlns="http://www.w3.org/2000/svg"
     width="874" height="475" viewBox="0 0 1600 870"
     role="img" aria-labelledby="title desc">
  <title id="title">Alur LAPAKIN: foto produk diproses AI menjadi listing</title>
  <desc id="desc">Foto produk di kiri terhubung ke AI di tengah lalu ke hasil listing di kanan. Garis konektor tetap terlihat tanpa titik ujung atau panah. Titik biru bergerak menuju AI. Saat menyentuh ring biru terluar, ring tersebut menyusut masuk ke inti sambil menghilang, lalu energi biru masuk ke inti. Ketika beam oranye mulai keluar, ring biru muncul kembali dari dalam ke luar sebelum titik oranye melanjutkan ke hasil listing.</desc>

  <defs>
    <filter id="shadowLg" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#00295D" flood-opacity=".08"/>
    </filter>
    <filter id="shadowSm" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#00295D" flood-opacity=".10"/>
    </filter>
    <filter id="amberGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#F99404" flood-opacity=".26" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="photoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FCFE"/>
      <stop offset="100%" stop-color="#E7F3FB"/>
    </linearGradient>
    <linearGradient id="listingBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00295D"/>
      <stop offset="100%" stop-color="#0C3D78"/>
    </linearGradient>

    <!-- Straight connector beams: always visible outside the AI -->
    <path id="pathInputToAI" d="M490 435 L676 435"/>
    <path id="pathAIToOutput" d="M924 435 L1080 435"/>

    <!-- Internal AI transfer paths. These animate only after the input dot reaches the outer blue ring. -->
    <path id="pathIntoAI" d="M676 435 L736 435"/>
    <path id="pathOutOfAI" d="M864 435 L924 435"/>
  </defs>

  <style>
    .beam-glow {
      fill: none;
      stroke: #BBDDF1;
      stroke-width: 12;
      stroke-linecap: round;
      opacity: .22;
    }
    .beam {
      fill: none;
      stroke: #2A89CD;
      stroke-width: 4;
      stroke-linecap: round;
    }
    .beam-output {
      fill: none;
      stroke: #F99404;
      stroke-width: 4;
      stroke-linecap: round;
    }
    .internal-beam-blue {
      fill: none;
      stroke: #2A89CD;
      stroke-width: 7;
      stroke-linecap: round;
      filter: url(#shadowSm);
    }
    .internal-beam-orange {
      fill: none;
      stroke: #F99404;
      stroke-width: 7;
      stroke-linecap: round;
      filter: url(#shadowSm);
    }
    .moving-dot { filter: url(#shadowSm); }
    .reaction-ring {
      fill: none;
      stroke: #F99404;
      stroke-width: 3;
      opacity: 0;
      vector-effect: non-scaling-stroke;
    }
    .label-text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #00295D;
      font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      .moving-dot, .reaction-ring, .orb-reactor, .orb-accent { display: none; }
    }
  </style>

  <!-- INPUT CARD -->
  <g filter="url(#shadowLg)">
    <rect x="70" y="160" width="420" height="550" rx="42" fill="#FFFFFF" stroke="#D8E4EE" stroke-width="2"/>

    <rect x="110" y="205" width="340" height="350" rx="30" fill="url(#photoBg)"/>

    <!-- Product photo panel -->
    <g filter="url(#shadowSm)">
      <rect x="125" y="220" width="310" height="320" rx="28" fill="#FFFFFF" stroke="#CFE0EC" stroke-width="2"/>
      <rect x="138" y="233" width="284" height="294" rx="23" fill="#F4EDE5"/>
      <rect x="150" y="245" width="260" height="270" rx="20" fill="#EFE5D9"/>

      <!-- Photo-frame hint -->
      <path d="M168 265h34M168 265v34M392 265h-34M392 265v34M168 495h34M168 495v-34M392 495h-34M392 495v-34"
        stroke="#B8CFDF" stroke-width="4" stroke-linecap="round"/>

      <!-- Crossbody leather bag illustration -->
      <g transform="translate(5 47) scale(1.12)">
        <path d="M196 286c6-24 28-41 58-41 29 0 52 15 60 40"
          fill="none" stroke="#6B4A34" stroke-width="7" stroke-linecap="round"/>
        <path d="M176 258c24 10 45 26 63 47"
          fill="none" stroke="#7D5B43" stroke-width="6" stroke-linecap="round" opacity=".95"/>
        <rect x="194" y="278" width="122" height="72" rx="18" fill="#8B5E3C"/>
        <rect x="194" y="278" width="122" height="28" rx="18" fill="#A7724B"/>
        <path d="M194 301h122v14c0 20-16 35-35 35h-52c-19 0-35-15-35-35v-14Z" fill="#7B5235"/>
        <rect x="208" y="292" width="94" height="16" rx="8" fill="#B78358" opacity=".9"/>
        <circle cx="255" cy="321" r="5.5" fill="#D8B06A"/>
        <path d="M250 321h10" stroke="#6D4B2D" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="221" y="332" width="68" height="6" rx="3" fill="#9A6B45" opacity=".55"/>
      </g>
    </g>

    <!-- Camera badge + label -->
    <circle cx="142" cy="625" r="34" fill="#EAF4FC"/>
    <g transform="translate(119 602)" fill="none" stroke="#00295D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12h8l4-6h10l4 6h8a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H8a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6Z"/>
      <circle cx="25" cy="29" r="9"/>
    </g>
    <text x="195" y="636" class="label-text" font-size="30">Foto produk</text>
  </g>

  <!-- INPUT → AI: clean connector line, no fixed endpoint dots -->
  <use href="#pathInputToAI" class="beam-glow"/>
  <use href="#pathInputToAI" class="beam"/>

  <!-- Moving input signal: travels only on the outside connector until it touches the outer blue AI ring -->
  <circle class="moving-dot" r="9" fill="#00295D" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;.015;.34;.345;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.015;.34;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.35 0 .2 1;0 0 1 1">
      <mpath href="#pathInputToAI"/>
    </animateMotion>
  </circle>

  <!-- Small trailing input particles -->
  <circle class="moving-dot" r="4.8" fill="#2A89CD" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;.72;.72;0;0" keyTimes="0;.07;.29;.295;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.07;.29;1" keyPoints="0;0;1;1" calcMode="linear">
      <mpath href="#pathInputToAI"/>
    </animateMotion>
  </circle>
  <circle class="moving-dot" r="3.8" fill="#62ADD9" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;.48;.48;0;0" keyTimes="0;.14;.33;.335;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.14;.33;1" keyPoints="0;0;1;1" calcMode="linear">
      <mpath href="#pathInputToAI"/>
    </animateMotion>
  </circle>

  <!-- Once the dot touches the outer blue ring, a blue energy beam is drawn inward toward the AI core. -->
  <use href="#pathIntoAI" class="internal-beam-blue" pathLength="1"
       stroke-dasharray="1" stroke-dashoffset="1" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.34;.345;.46;.49;1"/>
    <animate attributeName="stroke-dashoffset" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;.34;.46;.49;.52;1"/>
  </use>

  <!-- A tiny signal head rides the inward beam and is absorbed at the orange core. -->
  <circle class="moving-dot" r="6.5" fill="#2A89CD" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.34;.345;.455;.465;1"/>
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="6.5;6.5;6.5;3;0;0" keyTimes="0;.34;.345;.45;.47;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.34;.46;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1">
      <mpath href="#pathIntoAI"/>
    </animateMotion>
  </circle>

  <!-- CENTER AI RINGS -->
  <!--
    The outer blue boundary is the input trigger. As soon as the incoming blue dot
    reaches it (34% of the cycle), the boundary contracts toward the AI core while
    fading out, making the ring feel as if it is being pulled into the model. It
    stays hidden during processing/output, then quietly resets before the next loop.
  -->
  <circle cx="800" cy="435" r="124" fill="none" stroke="#2A89CD" stroke-width="3" opacity=".72"
          vector-effect="non-scaling-stroke">
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="124;124;108;82;64;64;76;98;124;124"
      keyTimes="0;.34;.375;.42;.48;.59;.625;.665;.70;1"
      calcMode="spline"
      keySplines="0 0 1 1;.30 0 .20 1;.30 0 .20 1;.30 0 .20 1;0 0 1 1;.30 0 .20 1;.30 0 .20 1;.30 0 .20 1;0 0 1 1"/>
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values=".72;.72;.55;.24;0;0;.22;.52;.72;.72"
      keyTimes="0;.34;.375;.42;.48;.59;.625;.665;.70;1"/>
    <animate attributeName="stroke-width" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="3;3;3.4;4;2;2.3;2.8;3.1;3;3"
      keyTimes="0;.34;.375;.42;.48;.59;.625;.665;.70;1"/>
  </circle>
  <circle cx="800" cy="435" r="104" fill="none" stroke="#2A89CD" stroke-width="2" stroke-dasharray="12 10" opacity=".52"/>

  <!-- AI reaction: starts after the blue beam has been absorbed -->
  <circle class="reaction-ring" cx="800" cy="435" r="105">
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="105;105;119;150;176;176" keyTimes="0;.455;.50;.56;.62;1"/>
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;.58;.26;0;0" keyTimes="0;.455;.50;.57;.62;1"/>
  </circle>
  <circle class="reaction-ring" cx="800" cy="435" r="105">
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="105;105;112;138;160;160" keyTimes="0;.49;.52;.58;.64;1"/>
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;.38;.17;0;0" keyTimes="0;.49;.52;.59;.64;1"/>
  </circle>

  <circle class="orb-reactor" cx="800" cy="435" r="86" fill="#F99404" opacity="0" filter="url(#amberGlow)">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;.18;.28;.10;0;0" keyTimes="0;.46;.50;.54;.58;.64;1"/>
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="86;86;92;99;93;86;86" keyTimes="0;.46;.50;.54;.58;.64;1"/>
  </circle>

  <!-- AI orb -->
  <g filter="url(#shadowSm)">
    <circle cx="800" cy="435" r="105" fill="#FFFFFF" stroke="#2A89CD" stroke-width="4"/>
    <circle cx="800" cy="435" r="82" fill="#FFF1D8"/>
    <circle cx="800" cy="435" r="64" fill="#F99404"/>

    <!-- simple sparkles -->
    <path d="M780 389l6 14 14 6-14 6-6 14-6-14-14-6 14-6Z" fill="#FFFFFF"/>
    <path d="M817 402l4 9 9 4-9 4-4 9-4-9-9-4 9-4Z" fill="#FFFFFF" opacity=".95"/>
    <text x="800" y="466" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">AI</text>
  </g>

  <circle class="orb-accent" cx="800" cy="435" r="82" fill="none" stroke="#F99404" stroke-width="3" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;.82;.32;0;0" keyTimes="0;.49;.53;.60;.65;1"/>
    <animate attributeName="r" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="82;82;88;94;82;82" keyTimes="0;.49;.53;.60;.65;1"/>
  </circle>

  <!-- Larger AI label bubble -->
  <g filter="url(#shadowSm)">
    <rect x="628" y="632" width="344" height="78" rx="39" fill="#FFFFFF" stroke="#D8E4EE" stroke-width="2"/>
    <text x="800" y="681" text-anchor="middle" fill="#00295D"
      font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">AI menyusun listing</text>
  </g>

  <!-- AI → OUTPUT: clean connector line, no endpoint dot and no arrowhead -->
  <use href="#pathAIToOutput" class="beam-glow"/>
  <use href="#pathAIToOutput" class="beam-output"/>

  <!-- After processing, orange energy grows outward from the AI core to the outer ring: reverse of the blue input. -->
  <use href="#pathOutOfAI" class="internal-beam-orange" pathLength="1"
       stroke-dasharray="1" stroke-dashoffset="1" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.59;.595;.70;.735;1"/>
    <animate attributeName="stroke-dashoffset" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="1;1;0;0;1;1" keyTimes="0;.59;.70;.73;.76;1"/>
  </use>

  <!-- Orange signal head emerges through the AI rings, then hands off to the outside connector. -->
  <circle class="moving-dot" r="6.5" fill="#F99404" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.59;.595;.695;.705;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.59;.70;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1">
      <mpath href="#pathOutOfAI"/>
    </animateMotion>
  </circle>

  <!-- Main output dot continues from the outer ring to the listing card. -->
  <circle class="moving-dot" r="8.5" fill="#F99404" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;.70;.705;.91;.915;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.70;.91;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.35 0 .2 1;0 0 1 1">
      <mpath href="#pathAIToOutput"/>
    </animateMotion>
  </circle>

  <!-- Small orange trailing particle -->
  <circle class="moving-dot" r="4.2" fill="#F9B34D" opacity="0">
    <animate attributeName="opacity" dur="5.2s" begin="0s" repeatCount="indefinite"
      values="0;0;.72;.72;0;0" keyTimes="0;.76;.765;.96;.965;1"/>
    <animateMotion dur="5.2s" begin="0s" repeatCount="indefinite"
      keyTimes="0;.76;.96;1" keyPoints="0;0;1;1" calcMode="linear">
      <mpath href="#pathAIToOutput"/>
    </animateMotion>
  </circle>

  <!-- OUTPUT CARD -->
  <g filter="url(#shadowLg)">
    <rect x="1080" y="180" width="450" height="530" rx="48" fill="url(#listingBg)"/>

    <rect x="1120" y="230" width="194" height="48" rx="10" fill="#214F82" opacity=".92"/>
    <text x="1217" y="262" text-anchor="middle" fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif" font-size="21"
      font-weight="700" letter-spacing="1.8">HASIL LISTING</text>

    <text x="1120" y="345" fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif" font-size="34"
      font-weight="700">Tas Selempang Kulit</text>

    <text x="1120" y="398" fill="#A7CCE8"
      font-family="Arial, Helvetica, sans-serif" font-size="26"
      font-weight="700">Kategori: <tspan fill="#FFFFFF">Fashion</tspan></text>

    <text x="1120" y="452" fill="#D5E2ED"
      font-family="Arial, Helvetica, sans-serif" font-size="23">Nyaman untuk aktivitas sehari-hari.</text>

    <line x1="1120" y1="507" x2="1488" y2="507" stroke="#5579A2" stroke-width="2"/>

    <text x="1120" y="565" fill="#A7CCE8"
      font-family="Arial, Helvetica, sans-serif" font-size="20">REKOMENDASI HARGA</text>
    <text x="1120" y="640" fill="#F99404"
      font-family="Arial, Helvetica, sans-serif" font-size="34"
      font-weight="800">Rp62.000</text>

    <g aria-hidden="true">
      <circle cx="1450" cy="625" r="30" fill="#F99404"/>
      <path d="M1436 625 L1446 635 L1466 613"
        fill="none" stroke="#FFFFFF" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
