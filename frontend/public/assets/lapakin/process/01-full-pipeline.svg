  .motion { filter:url(#smallShadow); }
  @media (prefers-reduced-motion: reduce) {
    .anim { display:none; }
    .static { opacity:1 !important; }
    .line, .under { opacity:1 !important; stroke-dasharray:none !important; stroke-dashoffset:0 !important; }
  }
</style>

