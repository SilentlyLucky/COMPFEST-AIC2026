  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#00295D" flood-opacity=".09"/>
  </filter>
  <linearGradient id="listingBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00295D"/>
    <stop offset="100%" stop-color="#0C3D78"/>
  </linearGradient>
</defs>

<style>
  .t { font-family: Arial, Helvetica, sans-serif; }
  .line { fill:none; stroke:#2A89CD; stroke-width:3.2; stroke-linecap:round; }
  .under { fill:none; stroke:#CFE4F2; stroke-width:7; stroke-linecap:round; opacity:.28; }
  .motion { filter:url(#smallShadow); }
  @media (prefers-reduced-motion: reduce) {
    .anim { display:none; }
    .static { opacity:1 !important; }
  }
</style>

<rect width="1050" height="560" fill="#fff"/>
