<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">LAPAKIN AI model architecture — official Qwen mark and OpenCLIP wordmark</title>
  <desc id="desc">A large partially cropped AI hub sits on the left. A large partially cropped AI hub sits on the left. Three bent connector lines extend from the AI border to the three model cards. Qwen uses its recognizable interlocking mark recolored orange, OpenCLIP uses its upstream project wordmark, and animated signal dots travel outward along each colored branch.</desc>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00295D" flood-opacity=".09"/>
    </filter>
    <filter id="smallShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#00295D" flood-opacity=".11"/>
    </filter>
    <filter id="amberGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feFlood flood-color="#F99404" flood-opacity=".20" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="qwenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/><stop offset="100%" stop-color="#FFF8EE"/>
    </linearGradient>
    <linearGradient id="clipBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFDFF"/><stop offset="100%" stop-color="#F1F8FE"/>
    </linearGradient>
    <linearGradient id="tfidfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFFFD"/><stop offset="100%" stop-color="#F3FBF6"/>
    </linearGradient>

    <!-- Clean solid branches begin directly on the outer blue AI border -->
    <path id="branchTop" d="M292 212 L365 212 L420 145 L545 145"/>
    <path id="branchMid" d="M340 350 L545 350"/>
    <path id="branchBot" d="M292 488 L365 488 L420 555 L545 555"/>
  </defs>

  <style>
    .t { font-family: Arial, Helvetica, sans-serif; }
    .connector-top { fill:none; stroke:#F99404; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .connector-mid { fill:none; stroke:#2A89CD; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .connector-bot { fill:none; stroke:#2FAB66; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
        .moving-dot { filter:url(#smallShadow); }
    @media (prefers-reduced-motion: reduce) {
      .motion-only { display:none; }
      .reveal { opacity:1 !important; transform:none !important; }

    }
  </style>

  <rect width="1400" height="700" fill="#FFFFFF"/>

  <!-- LARGE AI HUB: intentionally cropped by the left edge, like the reference -->
  <g id="ai-hub" transform="translate(120 350)">
    <g>
      <animateTransform attributeName="transform" type="translate" begin="0s" dur="900ms" fill="freeze"
        values="110 0;0 0" calcMode="spline" keySplines=".18 .78 .28 1"/>
      <g>
        <animateTransform attributeName="transform" type="scale" begin="0s" dur="900ms" fill="freeze"
          values=".68 .68;1 1" calcMode="spline" keySplines=".18 .78 .28 1"/>

        <!-- AI ring styling matched to the earlier pipeline SVG -->
        <circle r="220" fill="#FFFFFF" stroke="#2A89CD" stroke-width="4" filter="url(#shadow)"/>
        <circle r="168" fill="#FFFFFF"/>
        <circle r="132" fill="#FFF1D8"/>
        <circle r="94" fill="#F99404" filter="url(#amberGlow)"/>

        <path d="M-34 -76l9 21 21 9-21 9-9 21-9-21-21-9 21-9Z" fill="#FFFFFF"/>
        <path d="M36 -47l5 13 13 5-13 5-5 13-5-13-13-5 13-5Z" fill="#FFFFFF" opacity=".96"/>
        <text x="0" y="31" text-anchor="middle" class="t" fill="#FFFFFF" font-size="78" font-weight="800">AI</text>

        <circle class="motion-only" r="220" fill="none" stroke="#2A89CD" stroke-width="3" opacity="0">
          <animate attributeName="r" begin="1s" dur="2.8s" repeatCount="indefinite" values="220;236;254"/>
          <animate attributeName="opacity" begin="1s" dur="2.8s" repeatCount="indefinite" values=".20;.08;0"/>
        </circle>
      </g>
    </g>
  </g>
  <!-- Clean connector beams: straight and non-glowy -->

  <use href="#branchTop" class="connector-top" opacity="0">
    <animate attributeName="opacity" begin="620ms" dur="260ms" fill="freeze" from="0" to="1"/>
  </use>
  <use href="#branchMid" class="connector-mid" opacity="0">
    <animate attributeName="opacity" begin="700ms" dur="260ms" fill="freeze" from="0" to="1"/>
  </use>
  <use href="#branchBot" class="connector-bot" opacity="0">
    <animate attributeName="opacity" begin="780ms" dur="260ms" fill="freeze" from="0" to="1"/>
  </use>

  <!-- Traveling signals from the blue AI border to each model. No fixed endpoint dots. -->
  <circle class="motion-only moving-dot" r="8" fill="#F99404" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.05s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;.04;.54;.58;1"/>
    <animateMotion dur="4.8s" begin="1.05s" repeatCount="indefinite"
      keyTimes="0;.04;.54;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.35 0 .2 1;0 0 1 1">
      <mpath href="#branchTop"/>
    </animateMotion>
  </circle>
  <circle class="motion-only moving-dot" r="5" fill="#F9B34D" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.05s" repeatCount="indefinite"
      values="0;0;.55;.55;0;0" keyTimes="0;.12;.16;.48;.52;1"/>
    <animateMotion dur="4.8s" begin="1.05s" repeatCount="indefinite"
      keyTimes="0;.12;.48;1" keyPoints="0;0;1;1"><mpath href="#branchTop"/></animateMotion>
  </circle>

  <circle class="motion-only moving-dot" r="8" fill="#2A89CD" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.45s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;.04;.54;.58;1"/>
    <animateMotion dur="4.8s" begin="1.45s" repeatCount="indefinite"
      keyTimes="0;.04;.54;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.35 0 .2 1;0 0 1 1">
      <mpath href="#branchMid"/>
    </animateMotion>
  </circle>
  <circle class="motion-only moving-dot" r="5" fill="#62ADD9" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.45s" repeatCount="indefinite"
      values="0;0;.55;.55;0;0" keyTimes="0;.12;.16;.48;.52;1"/>
    <animateMotion dur="4.8s" begin="1.45s" repeatCount="indefinite"
      keyTimes="0;.12;.48;1" keyPoints="0;0;1;1"><mpath href="#branchMid"/></animateMotion>
  </circle>

  <circle class="motion-only moving-dot" r="8" fill="#2FAB66" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.85s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;.04;.54;.58;1"/>
    <animateMotion dur="4.8s" begin="1.85s" repeatCount="indefinite"
      keyTimes="0;.04;.54;1" keyPoints="0;0;1;1" calcMode="spline"
      keySplines="0 0 1 1;.35 0 .2 1;0 0 1 1">
      <mpath href="#branchBot"/>
    </animateMotion>
  </circle>
  <circle class="motion-only moving-dot" r="5" fill="#74C68E" opacity="0">
    <animate attributeName="opacity" dur="4.8s" begin="1.85s" repeatCount="indefinite"
      values="0;0;.55;.55;0;0" keyTimes="0;.12;.16;.48;.52;1"/>
    <animateMotion dur="4.8s" begin="1.85s" repeatCount="indefinite"
      keyTimes="0;.12;.48;1" keyPoints="0;0;1;1"><mpath href="#branchBot"/></animateMotion>
  </circle>

  <!-- TOP MODEL — horizontal pill card -->
  <g id="model-qwen" opacity="0" filter="url(#shadow)">
    <animate attributeName="opacity" begin="1050ms" dur="360ms" fill="freeze" from="0" to="1"/>
    <animateTransform attributeName="transform" type="translate" begin="1050ms" dur="520ms" fill="freeze" values="34 0;0 0" calcMode="spline" keySplines=".18 .78 .28 1"/>

    <!-- outer white pill -->
    <rect x="545" y="70" width="760" height="150" rx="58" fill="#FFFFFF" stroke="#F2D49C" stroke-width="2"/>
    <!-- colored left capsule -->
    <rect x="545" y="70" width="220" height="150" rx="58" fill="#F99404"/>
    <!-- circular icon plate -->
    <circle cx="655" cy="145" r="47" fill="#FFFFFF" filter="url(#smallShadow)"/>
    <circle cx="655" cy="145" r="37" fill="#FFF5E4"/>
    <!-- Qwen official icon geometry, recolored to LAPAKIN orange -->
    <g transform="translate(622 112) scale(.258)" aria-label="Qwen logo">
      <path fill="#F99404" d="M129.263 0a6.75 6.75 0 0 1 5.88 3.374l15.256 26.424l65.258-.482a6.75 6.75 0 0 1 5.892 3.373l16.843 29.172a6.75 6.75 0 0 1-.038 6.811l-15.569 26.29a6.7 6.7 0 0 1-.887 1.182l33.195 56.28a6.75 6.75 0 0 1 .021 6.72l-16.94 29.706a6.75 6.75 0 0 1-5.86 3.405h-30.513l-32.21 56.756a6.75 6.75 0 0 1-5.868 3.417h-33.686a6.75 6.75 0 0 1-5.88-3.438l-15.022-26.7l-67.31.06a6.75 6.75 0 0 1-5.831-3.343l-17.256-29.523a6.75 6.75 0 0 1-.018-6.777l15.256-26.425L.929 100.008a6.75 6.75 0 0 1-.025-6.79l16.843-29.172a6.75 6.75 0 0 1 5.917-3.374l30.553.339a6.7 6.7 0 0 1 1.789.262L89.258 3.562a6.75 6.75 0 0 1 5.81-3.379z"/>
      <path fill="#FFFFFF" d="m180.679 97.445l36.108.025l33.198 58.74h-34.51l-17.266-30.239l-68.54 119.948l-17.218-29.263zM57.85 66.893l69.028 118.902l-17.872 30.86l-67.905-.622l17.255-29.887l34.82.166L23.567 66.981zm37.24-60.8l17.256 29.887l-17.554 30.07l138.147-.616l-17.064 29.733l-137.896.33L59.917 66.05z"/>
    </g>

    <text x="790" y="126" class="t" fill="#2E211B" font-size="28" font-weight="800">Qwen2.5-VL-3B-Instruct + LoRA</text>
    <text x="790" y="171" class="t" fill="#6F625B" font-size="24">Generasi judul &amp; deskripsi produk</text>
  </g>

  <!-- MIDDLE MODEL — horizontal pill card -->
  <g id="model-openclip" opacity="0" filter="url(#shadow)">
    <animate attributeName="opacity" begin="1210ms" dur="360ms" fill="freeze" from="0" to="1"/>
    <animateTransform attributeName="transform" type="translate" begin="1210ms" dur="520ms" fill="freeze" values="34 0;0 0" calcMode="spline" keySplines=".18 .78 .28 1"/>

    <rect x="545" y="275" width="760" height="150" rx="58" fill="#FFFFFF" stroke="#B9DCF5" stroke-width="2"/>
    <rect x="545" y="275" width="220" height="150" rx="58" fill="#2A89CD"/>
    <circle cx="655" cy="350" r="47" fill="#FFFFFF" filter="url(#smallShadow)"/>
    <circle cx="655" cy="350" r="37" fill="#EFF7FD"/>
    <!-- OpenAI logo used here per requested visual treatment. -->
    <g aria-label="OpenAI logo" transform="translate(631 326) scale(2)" fill="#111111">
      <path d="M22.282 9.821a6 6 0 0 0-.516-4.91 6.05 6.05 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a6 6 0 0 0-3.998 2.9 6.05 6.05 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.05 6.05 0 0 0 6.515 2.9A6 6 0 0 0 13.26 24a6.06 6.06 0 0 0 5.772-4.206 6 6 0 0 0 3.997-2.9 6.06 6.06 0 0 0-.747-7.073M13.26 22.43a4.48 4.48 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.8.8 0 0 0 .392-.681v-6.737l2.02 1.168a.07.07 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494M3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.77.77 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646M2.34 7.896a4.5 4.5 0 0 1 2.366-1.973V11.6a.77.77 0 0 0 .388.677l5.815 3.354-2.02 1.168a.08.08 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855-5.833-3.387L15.119 7.2a.08.08 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667m2.01-3.023-.141-.085-4.774-2.782a.78.78 0 0 0-.785 0L9.409 9.23V6.897a.07.07 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zM8.307 12.863l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.081-4.783 2.758a.77.77 0 0 0-.392.681zm1.099-2.365 2.602-1.501 2.602 1.501v3.002l-2.602 1.502-2.602-1.502Z"/>
    </g>

    <text x="790" y="331" class="t" fill="#0B376D" font-size="29" font-weight="800">OpenCLIP ViT-B-32 + LAION2B</text>
    <text x="790" y="376" class="t" fill="#526A80" font-size="24">Klasifikasi kategori produk</text>
  </g>

  <!-- BOTTOM MODEL — horizontal pill card -->
  <g id="model-tfidf" opacity="0" filter="url(#shadow)">
    <animate attributeName="opacity" begin="1370ms" dur="360ms" fill="freeze" from="0" to="1"/>
    <animateTransform attributeName="transform" type="translate" begin="1370ms" dur="520ms" fill="freeze" values="34 0;0 0" calcMode="spline" keySplines=".18 .78 .28 1"/>

    <rect x="545" y="480" width="760" height="150" rx="58" fill="#FFFFFF" stroke="#B7DFC3" stroke-width="2"/>
    <rect x="545" y="480" width="220" height="150" rx="58" fill="#2FAB66"/>
    <circle cx="655" cy="555" r="47" fill="#FFFFFF" filter="url(#smallShadow)"/>
    <circle cx="655" cy="555" r="37" fill="#F0FAF4"/>
    <rect x="637" y="536" width="30" height="35" rx="6" fill="none" stroke="#2FAB66" stroke-width="3"/>
    <path d="M643 545h17M643 553h14M643 561h10" stroke="#2FAB66" stroke-width="3" stroke-linecap="round"/>
    <path d="M663 557l15 7-9 18-15-7Z" fill="#2FAB66"/>

    <text x="790" y="536" class="t" fill="#176036" font-size="30" font-weight="800">TF-IDF Catalog</text>
    <text x="790" y="581" class="t" fill="#527764" font-size="24">Pencarian harga pasar</text>
  </g>
</svg>
